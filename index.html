<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>VIS Marketing • Vertical Infographic Stream</title>
    <meta name="description" content="Eksplorasi visual 1.161 konsep psikologi konsumen, framework bisnis, strategi pemasaran, copywriting, dan metrik growth.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;

            --bg: #F0F9FF;
            --card-bg: #FFFFFF;
            --primary: #0284C7;
            --primary-dark: #0369A1;
            --primary-light: #38BDF8;
            --primary-border: #BAE6FD;
            --primary-soft-bg: #E0F2FE;
            --accent-glow: rgba(2, 132, 199, 0.22);
            --text-heading: #0C4A6E;
            --text-body: #0369A1;
            --text-muted: #0284C7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text-body);
            min-height: 100vh;
            position: relative;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, rgba(14, 165, 233, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(2, 132, 199, 0.15) 0%, transparent 50%),
                radial-gradient(rgba(56, 189, 248, 0.18) 1.5px, transparent 1.5px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 28px 28px;
            background-attachment: fixed;
        }

        body.view-reader {
            background: #081626 !important;
            background-image: none !important;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 6rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem 4rem;
            }
        }

        /* 3D SPATIAL HERO STAGE */
        .spatial-hero {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 3rem;
            align-items: center;
            padding: 3rem 0 4rem;
            border-bottom: 2px dashed var(--primary-border);
            margin-bottom: 3.5rem;
            perspective: 1200px;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
        }

        @media (max-width: 960px) {
            .spatial-hero {
                grid-template-columns: 1fr;
                gap: 2rem;
                text-align: center;
                padding: 1.5rem 0 2.5rem;
                margin-bottom: 2rem;
            }
        }

        .hero-left {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
            max-width: 100%;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.45rem 1.15rem;
            background: var(--primary-soft-bg);
            border: 1.5px solid var(--primary-border);
            border-radius: 9999px;
            font-size: 0.78rem;
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--primary-dark);
            letter-spacing: 0.08em;
            width: fit-content;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        @media (max-width: 960px) {
            .hero-badge {
                margin: 0 auto;
            }
        }

        .hero-title {
            font-family: var(--font-display);
            font-size: clamp(2.2rem, 6vw, 4.6rem);
            font-weight: 800;
            color: var(--text-heading);
            line-height: 1.08;
            letter-spacing: -0.03em;
            word-break: break-word;
        }

        .hero-title span {
            background: linear-gradient(135deg, #0369A1 0%, #0284C7 50%, #0EA5E9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px var(--accent-glow);
        }

        .hero-desc {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 540px;
        }

        @media (max-width: 960px) {
            .hero-desc {
                margin: 0 auto;
                font-size: 0.95rem;
            }
        }

        /* 3D TILTED POSTER DECK IN HERO */
        .poster-deck-3d {
            position: relative;
            height: 380px;
            width: 100%;
            max-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            transform: rotateY(-10deg) rotateX(6deg);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .poster-deck-3d:hover {
            transform: rotateY(-2deg) rotateX(2deg) scale(1.03);
        }

        @media (max-width: 768px) {
            .poster-deck-3d {
                height: 270px;
                transform: scale(0.72) rotateY(-6deg) rotateX(4deg);
            }
        }

        @media (max-width: 480px) {
            .poster-deck-3d {
                height: 230px;
                transform: scale(0.62) rotateY(-4deg) rotateX(2deg);
            }
        }

        .deck-card {
            position: absolute;
            width: 140px;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.08), 0 0 25px var(--accent-glow);
            border: 2px solid #FFFFFF;
            background: #FFF;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .deck-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .deck-card:hover {
            transform: translateY(-22px) scale(1.12) !important;
            z-index: 100 !important;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15), 0 0 35px var(--accent-glow);
            border-color: var(--primary);
        }

        .deck-card.c1 { transform: translateX(-160px) rotateZ(-12deg) translateY(10px); z-index: 1; }
        .deck-card.c2 { transform: translateX(-80px) rotateZ(-6deg) translateY(5px); z-index: 2; }
        .deck-card.c3 { transform: translateX(0px) rotateZ(0deg); z-index: 3; border-color: var(--primary); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.12), 0 0 30px var(--accent-glow); }
        .deck-card.c4 { transform: translateX(80px) rotateZ(6deg) translateY(5px); z-index: 2; }
        .deck-card.c5 { transform: translateX(160px) rotateZ(12deg) translateY(10px); z-index: 1; }

        /* VIEW SWITCHER & SEARCH TOOLBAR */
        .controls-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            width: 100%;
            max-width: 100%;
        }

        @media (max-width: 768px) {
            .controls-toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
        }

        .view-tabs {
            display: flex;
            background: #FFFFFF;
            padding: 0.35rem;
            border-radius: 9999px;
            border: 1.5px solid var(--primary-border);
            box-shadow: 0 4px 15px var(--accent-glow);
            gap: 0.35rem;
            max-width: 100%;
        }

        @media (max-width: 768px) {
            .view-tabs {
                width: 100%;
            }
        }

        .view-tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 0.88rem;
            padding: 0.55rem 1.35rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        @media (max-width: 768px) {
            .view-tab-btn {
                flex: 1;
                justify-content: center;
                padding: 0.5rem 0.5rem;
                font-size: 0.82rem;
            }
        }

        .view-tab-btn.active {
            background: linear-gradient(135deg, #0284C7, #0EA5E9);
            color: #FFFFFF;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .search-pill-box {
            display: flex;
            align-items: center;
            background: #FFFFFF;
            border: 1.5px solid var(--primary-border);
            border-radius: 9999px;
            padding: 0.6rem 1.35rem;
            gap: 0.75rem;
            min-width: 0;
            flex: 1;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: all 0.2s;
        }

        @media (max-width: 768px) {
            .search-pill-box {
                max-width: 100%;
            }
        }

        .search-pill-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .search-pill-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-heading);
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 500;
            min-width: 0;
        }

        .search-pill-input::placeholder {
            color: var(--primary-light);
        }

        /* CATEGORY FILTER CAPSULES */
        .category-capsules {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-bottom: 3rem;
            justify-content: center;
            width: 100%;
            max-width: 100%;
        }

        @media (max-width: 768px) {
            .category-capsules {
                gap: 0.4rem;
                margin-bottom: 2rem;
            }
        }

        .capsule-btn {
            padding: 0.55rem 1.25rem;
            border-radius: 9999px;
            background: #FFFFFF;
            border: 1.5px solid var(--primary-border);
            color: var(--primary-dark);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            box-shadow: 0 2px 8px var(--accent-glow);
            transition: all 0.2s;
        }

        @media (max-width: 768px) {
            .capsule-btn {
                font-size: 0.78rem;
                padding: 0.4rem 0.85rem;
            }
        }

        .capsule-btn:hover {
            border-color: var(--primary);
            color: var(--text-heading);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        .capsule-btn.active {
            background: linear-gradient(135deg, #0284C7, #0EA5E9);
            border-color: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 4px 18px var(--accent-glow);
        }

        /* EXHIBITS GRID */
        .exhibits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 100%;
        }

        @media (max-width: 600px) {
            .exhibits-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }
        }

        .exhibit-card {
            background: #FFFFFF;
            border: 1.5px solid var(--primary-border);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 10px 25px var(--accent-glow);
            width: 100%;
            max-width: 100%;
        }

        .exhibit-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px var(--accent-glow);
        }

        /* POSTER TRIPLE-STAGE BANNER */
        .exhibit-poster-stage {
            height: 220px;
            background: var(--primary-soft-bg);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 1rem;
            cursor: pointer;
            border-bottom: 1.5px solid var(--primary-border);
            width: 100%;
            max-width: 100%;
        }

        .stage-thumb {
            height: 100%;
            width: 75px;
            border-radius: 10px;
            object-fit: cover;
            border: 1.5px solid #FFFFFF;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .stage-thumb.center {
            width: 90px;
            transform: scale(1.08);
            border-color: var(--primary);
            box-shadow: 0 12px 25px var(--accent-glow);
            z-index: 2;
        }

        .exhibit-card:hover .stage-thumb.center {
            transform: scale(1.15);
        }

        .exhibit-body {
            padding: 1.65rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
            justify-content: space-between;
        }

        .exhibit-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        .exhibit-theme-badge {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-dark);
        }

        .exhibit-title {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-heading);
            line-height: 1.25;
        }

        .exhibit-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1.5px dashed var(--primary-border);
        }

        .btn-launch-stream {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #0284C7, #0EA5E9);
            color: #FFFFFF;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 0.88rem;
            padding: 0.6rem 1.4rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-launch-stream:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        /* VIEW 2: POSTER WALL */
        .poster-wall-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.25rem;
            width: 100%;
            max-width: 100%;
        }

        @media (max-width: 480px) {
            .poster-wall-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.65rem;
            }
        }

        .wall-item {
            border-radius: 16px;
            overflow: hidden;
            background: #FFFFFF;
            border: 1.5px solid var(--primary-border);
            aspect-ratio: 1 / 3;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 18px var(--accent-glow);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .wall-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .wall-item:hover {
            transform: translateY(-8px) scale(1.04);
            border-color: var(--primary);
            box-shadow: 0 20px 35px var(--accent-glow);
            z-index: 10;
        }

        .wall-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.88) 45%);
            padding: 1.5rem 0.75rem 0.75rem;
            color: #FFFFFF;
            font-size: 0.78rem;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .wall-item:hover .wall-caption {
            opacity: 1;
        }

        /* ========================================================
           READER VIEW (DOOM-SCROLL WITH IDENTICAL AUTO-HIDE NAV)
           ======================================================== */
        #readerView {
            display: none;
            width: 100%;
            min-height: 100vh;
            background-color: #081626;
        }

        .reader-nav {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            background: rgba(8, 22, 38, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            border: 1px solid var(--primary-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--accent-glow);
            max-width: calc(100vw - 20px);
            box-sizing: border-box;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s ease;
        }

        .reader-nav.nav-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: translateX(-50%) translateY(-24px) !important;
        }

        .nav-back-btn, .nav-fullscreen-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.15s ease;
        }

        .nav-back-btn:hover, .nav-fullscreen-btn:hover {
            background: var(--primary);
            border-color: var(--primary-light);
        }

        .nav-title-text {
            font-size: 0.88rem;
            font-weight: 700;
            color: #FFFFFF;
            max-width: 160px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (min-width: 600px) {
            .nav-title-text {
                max-width: 240px;
            }
        }

        .nav-picker-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.15s ease;
        }

        .nav-picker-btn:hover {
            background: var(--primary);
        }

        .nav-picker-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            width: 360px;
            max-width: 92vw;
            max-height: 420px;
            background: rgba(8, 22, 38, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--primary-border);
            border-radius: 18px;
            padding: 0.85rem;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7), 0 0 25px var(--accent-glow);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 10000;
        }

        .nav-picker-dropdown.is-open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateX(-50%) scale(1);
        }

        .picker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.3rem 0.5rem 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.78rem;
            color: #E2E8F0;
            font-weight: 700;
        }

        .picker-list {
            overflow-y: auto;
            max-height: 320px;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            padding-right: 4px;
        }

        .picker-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.45rem 0.65rem;
            border-radius: 10px;
            color: #CBD5E1;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s;
        }

        .picker-item:hover, .picker-item.active {
            background: var(--primary);
            color: #FFFFFF;
        }

        .picker-item-thumb {
            width: 32px;
            height: 48px;
            border-radius: 4px;
            object-fit: cover;
            background: #000;
            flex-shrink: 0;
        }

        .picker-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            font-weight: 600;
        }

        /* DOOM FEED STREAM (ZERO CLS) */
        .doom-feed {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            padding: 0;
            background-color: #081626;
        }

        .article-frame {
            width: 100%;
            aspect-ratio: 1 / 3;
            background-color: #081626;
            position: relative;
            overflow: hidden;
            display: block;
        }

        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }

        .article-img.is-loaded {
            opacity: 1;
        }

        /* RESTORE TOAST */
        .restore-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(8, 22, 38, 0.95);
            color: #FFFFFF;
            padding: 0.65rem 1.35rem;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 600;
            border: 1px solid var(--primary-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px var(--accent-glow);
            z-index: 99999;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .restore-toast.is-visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="view-home">
    <div id="homeView">
        <div class="container">
            <!-- 3D SPATIAL HERO -->
            <section class="spatial-hero">
                <div class="hero-left">
                    <div class="hero-badge">
                        <span>1,161 INFOGRAPHICS • MARKETING &amp; STRATEGY</span>
                    </div>
                    <h1 class="hero-title">Museum of <span>Marketing</span> &amp; Strategy</h1>
                    <p class="hero-desc">
                        Penjelajahan visual 1.161 konsep psikologi konsumen, framework strategi pemasaran, copywriting, taktik channel digital, dan metrik bisnis.
                    </p>
                </div>

                <!-- 3D INTERACTIVE FAN DECK -->
                <div class="poster-deck-3d" id="heroPosterDeck">
                    <!-- Dynamic Top Deck Cards -->
                </div>
            </section>

            <!-- CONTROLS TOOLBAR -->
            <section class="controls-toolbar">
                <div class="view-tabs">
                    <button type="button" class="view-tab-btn active" id="tabExhibitsBtn" onclick="switchView('exhibits');">
                        <span>🏛️</span> <span>Exhibits Grid</span>
                    </button>
                    <button type="button" class="view-tab-btn" id="tabWallBtn" onclick="switchView('wall');">
                        <span>🖼️</span> <span>Full Poster Wall</span>
                    </button>
                </div>

                <div class="search-pill-box">
                    <span style="font-size: 0.9rem; opacity: 0.7;">🔍</span>
                    <input type="text" id="matrixSearchInput" class="search-pill-input" placeholder="Cari topik, materi, atau konsep..." oninput="handleSearch(this.value)">
                </div>
            </section>

            <!-- CATEGORY FILTER CAPSULES -->
            <section class="category-capsules" id="categoryCapsules">
                <!-- Injected via JS -->
            </section>

            <!-- VIEW 1: EXHIBITS GRID -->
            <section class="exhibits-grid" id="exhibitsGrid">
                <!-- Injected via JS -->
            </section>

            <!-- VIEW 2: POSTER WALL -->
            <section class="poster-wall-grid" id="posterWallGrid">
                <!-- Injected via JS -->
            </section>
        </div>
    </div>

    <!-- FULLSCREEN READER VIEW -->
    <div id="readerView">
        <nav class="reader-nav" id="readerNav">
            <button type="button" class="nav-back-btn" onclick="closeReader();">
                <span>✕</span> <span>Tutup</span>
            </button>
            <span class="nav-title-text" id="navFolderTitle">Materi</span>
            
            <div style="position: relative;">
                <button type="button" class="nav-picker-btn" id="navPickerBtn" onclick="togglePickerDropdown(event);">
                    <span id="navPickerLabel">Pilih Artikel</span>
                    <span style="font-size: 0.65rem;">▼</span>
                </button>
                <div class="nav-picker-dropdown" id="navPickerDropdown">
                    <div class="picker-header">
                        <span>DAFTAR ARTIKEL</span>
                        <span id="pickerTotalBadge">0</span>
                    </div>
                    <div class="picker-list" id="navPickerList"></div>
                </div>
            </div>

            <button type="button" class="nav-fullscreen-btn" onclick="toggleFullScreen();">
                <span>⛶</span>
            </button>
        </nav>
        <main class="doom-feed" id="doomFeed"></main>
        <div class="restore-toast" id="restoreToast">
            <span id="restoreToastText">Melanjutkan membaca...</span>
        </div>
    </div>

    <script src="marketing-data.js"></script>
    <script src="data.js"></script>
    <script>
        const libraryData = window.libraryData || [];

        const folderMap = {};
        libraryData.forEach(f => { folderMap[f.rawName] = f; });

        const homeView = document.getElementById('homeView');
        const readerView = document.getElementById('readerView');
        const heroPosterDeck = document.getElementById('heroPosterDeck');
        const exhibitsGrid = document.getElementById('exhibitsGrid');
        const posterWallGrid = document.getElementById('posterWallGrid');
        const categoryCapsules = document.getElementById('categoryCapsules');
        const matrixSearchInput = document.getElementById('matrixSearchInput');
        const doomFeed = document.getElementById('doomFeed');
        const nav = document.getElementById('readerNav');
        const navFolderTitle = document.getElementById('navFolderTitle');
        const navPickerBtn = document.getElementById('navPickerBtn');
        const navPickerDropdown = document.getElementById('navPickerDropdown');
        const navPickerLabel = document.getElementById('navPickerLabel');
        const navPickerList = document.getElementById('navPickerList');
        const pickerTotalBadge = document.getElementById('pickerTotalBadge');

        let currentView = 'exhibits';
        let activeCategory = 'all';
        let currentSearch = '';
        let currentFeedImages = [];
        let currentFolderRaw = null;
        let observer = null;
        let lastScrollY = window.scrollY;
        let isNavHidden = false;
        let userHasInteracted = false;
        let isRestoring = false;

        const STORAGE_KEY = 'vis_marketing_positions';

        
        const MARKETING_CATEGORIES = [
            { id: 'all', label: '🌸 Semua Topik (14)', test: () => true },
            { id: 'psikologi', label: '🧠 Psikologi & Konsumen', test: f => ['01', '10', '11'].includes(f.number) },
            { id: 'strategi', label: '📊 Framework & Strategi', test: f => ['02', '13', '14'].includes(f.number) },
            { id: 'metrik', label: '📈 Metrik & Formula', test: f => ['03'].includes(f.number) },
            { id: 'kampanye', label: '🏆 Kampanye & Brand', test: f => ['04', '05', '09'].includes(f.number) },
            { id: 'digital', label: '📱 Copywriting & Digital', test: f => ['07', '08'].includes(f.number) },
            { id: 'tokoh', label: '🏛️ Tokoh & Sejarah', test: f => ['06', '12'].includes(f.number) },
        ];

        function isFolderInCategory(f, catId) {
            const cat = MARKETING_CATEGORIES.find(c => c.id === catId);
            return cat ? cat.test(f) : true;
        }

        function getFolderThemeTag(f) {
            const num = f.number || '';
            if (['01', '10', '11'].includes(num)) return 'PSIKOLOGI KONSUMEN';
            if (['02', '13', '14'].includes(num)) return 'FRAMEWORK & STRATEGI';
            if (['03'].includes(num)) return 'METRIK & FORMULA';
            if (['04', '05', '09'].includes(num)) return 'KAMPANYE & BRANDING';
            if (['07', '08'].includes(num)) return 'COPYWRITING & DIGITAL';
            return 'TOKOH & SEJARAH MARKETING';
        }

        function renderCategoryCapsules() {
            let html = '';
            MARKETING_CATEGORIES.forEach(c => {
                const activeCls = (c.id === activeCategory) ? 'active' : '';
                html += `<button type="button" class="capsule-btn ${activeCls}" onclick="setCategory('${c.id}', this);">${c.label}</button>`;
            });
            categoryCapsules.innerHTML = html;
        }


        function init() {
            renderHeroDeck();
            renderCategoryCapsules();
            renderExhibits();
            renderPosterWall();
            setupReaderInteraction();
            checkUrlHash();
        }

        function renderHeroDeck() {
            const samplePosters = [];
            for (const f of libraryData) {
                if (f.images && f.images.length > 0) {
                    samplePosters.push({
                        url: f.images[0].url,
                        folderRaw: f.rawName
                    });
                }
                if (samplePosters.length >= 5) break;
            }

            let html = '';
            samplePosters.forEach((p, idx) => {
                const cClass = `c${idx + 1}`;
                html += `
                    <div class="deck-card ${cClass}" onclick="openReader('${p.folderRaw}');">
                        <img src="${p.url}" alt="Poster Deck Item" loading="lazy">
                    </div>
                `;
            });
            heroPosterDeck.innerHTML = html;
        }

        function getFilteredFolders() {
            return libraryData.filter(f => {
                const matchCat = (activeCategory === 'all') || isFolderInCategory(f, activeCategory);
                const query = currentSearch.toLowerCase().trim();
                const matchSearch = !query || 
                    (f.displayName && f.displayName.toLowerCase().includes(query)) ||
                    (f.rawName && f.rawName.toLowerCase().includes(query)) ||
                    (f.images && f.images.some(img => (img.cleanTitle && img.cleanTitle.toLowerCase().includes(query)) || (img.name && img.name.toLowerCase().includes(query))));
                return matchCat && matchSearch;
            });
        }

        function renderExhibits() {
            const list = getFilteredFolders();
            let html = '';
            list.forEach(f => {
                const imgs = f.images || [];
                const imgCount = imgs.length;
                const p1 = imgs[0] ? imgs[0].url : '';
                const p2 = imgs[1] ? imgs[1].url : p1;
                const p3 = imgs[2] ? imgs[2].url : p1;
                const themeTag = getFolderThemeTag(f);

                html += `
                    <article class="exhibit-card">
                        <div class="exhibit-poster-stage" onclick="openReader('${f.rawName}');">
                            ${p1 ? `<img src="${p1}" class="stage-thumb" alt="Preview 1" loading="lazy">` : ''}
                            ${p2 ? `<img src="${p2}" class="stage-thumb center" alt="Preview 2" loading="lazy">` : ''}
                            ${p3 ? `<img src="${p3}" class="stage-thumb" alt="Preview 3" loading="lazy">` : ''}
                        </div>
                        <div class="exhibit-body">
                            <div>
                                <div class="exhibit-meta-row">
                                    <span class="exhibit-theme-badge">${themeTag}</span>
                                    <span style="color: var(--primary); font-weight:700;">#${f.number || '01'}</span>
                                </div>
                                <h2 class="exhibit-title">${escapeHtml(f.displayName)}</h2>
                            </div>
                            <div class="exhibit-footer">
                                <span style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-muted); font-weight:600;">${imgCount} Visual Posters</span>
                                <button type="button" class="btn-launch-stream" onclick="openReader('${f.rawName}');">
                                    <span>Buka Stream</span>
                                </button>
                            </div>
                        </div>
                    </article>
                `;
            });
            exhibitsGrid.innerHTML = html || '<div style="padding:3rem; text-align:center; color:var(--text-muted);">Tidak ada hasil ditemukan.</div>';
        }

        function renderPosterWall() {
            const list = getFilteredFolders();
            let html = '';
            list.forEach(f => {
                (f.images || []).forEach((img, idx) => {
                    html += `
                        <div class="wall-item" onclick="openReader('${f.rawName}', ${idx});">
                            <img src="${img.url}" alt="${escapeHtml(img.cleanTitle || img.name)}" loading="lazy">
                            <div class="wall-caption">${escapeHtml(img.cleanTitle || img.name)}</div>
                        </div>
                    `;
                });
            });
            posterWallGrid.innerHTML = html || '<div style="padding:3rem; text-align:center; color:var(--text-muted);">Tidak ada poster ditemukan.</div>';
        }

        function switchView(view) {
            currentView = view;
            if (view === 'exhibits') {
                document.getElementById('tabExhibitsBtn').classList.add('active');
                document.getElementById('tabWallBtn').classList.remove('active');
                exhibitsGrid.style.display = 'grid';
                posterWallGrid.style.display = 'none';
            } else {
                document.getElementById('tabWallBtn').classList.add('active');
                document.getElementById('tabExhibitsBtn').classList.remove('active');
                exhibitsGrid.style.display = 'none';
                posterWallGrid.style.display = 'grid';
                renderPosterWall();
            }
        }

        function setCategory(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.capsule-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderExhibits();
            if (currentView === 'wall') renderPosterWall();
        }

        function handleSearch(val) {
            currentSearch = val;
            renderExhibits();
            if (currentView === 'wall') renderPosterWall();
        }

        function openReader(folderRaw, startIdx = 0) {
            const folder = folderMap[folderRaw];
            if (!folder) return;

            currentFolderRaw = folderRaw;
            currentFeedImages = folder.images || [];

            homeView.style.display = 'none';
            readerView.style.display = 'block';
            document.body.classList.remove('view-home');
            document.body.classList.add('view-reader');

            navFolderTitle.textContent = folder.displayName;
            window.location.hash = folderRaw;

            buildDoomFeed();
            buildPickerDropdown();

            const saved = getSavedPosition(folderRaw);
            if (startIdx > 0) {
                setTimeout(() => scrollToArticle(startIdx), 60);
            } else if (saved && saved.scrollY > 100) {
                isRestoring = true;
                setTimeout(() => {
                    window.scrollTo({ top: saved.scrollY, behavior: 'instant' });
                    showToast('Melanjutkan ke posisi bacaan terakhir...');
                    setTimeout(() => { isRestoring = false; }, 300);
                }, 80);
            } else {
                window.scrollTo({ top: 0, behavior: 'instant' });
            }
        }

        function closeReader() {
            saveCurrentPosition();
            if (observer) observer.disconnect();

            readerView.style.display = 'none';
            homeView.style.display = 'block';
            document.body.classList.remove('view-reader');
            document.body.classList.add('view-home');

            doomFeed.innerHTML = '';
            currentFolderRaw = null;
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }

        function buildDoomFeed() {
            if (observer) observer.disconnect();
            doomFeed.innerHTML = '';

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const frame = entry.target;
                        const idx = parseInt(frame.dataset.index, 10);
                        loadFrameImage(frame);
                        preloadRunway(idx);
                        updatePickerActiveIndex(idx);
                    }
                });
            }, {
                rootMargin: '600px 0px 600px 0px',
                threshold: 0.01
            });

            currentFeedImages.forEach((img, idx) => {
                const frame = document.createElement('div');
                frame.className = 'article-frame';
                frame.dataset.index = idx;
                frame.dataset.src = img.url;
                frame.id = `art-frame-${idx}`;
                doomFeed.appendChild(frame);
                observer.observe(frame);
            });
        }

        function loadFrameImage(frame) {
            if (frame.dataset.loaded === 'true') return;
            frame.dataset.loaded = 'true';

            const img = document.createElement('img');
            img.className = 'article-img';
            img.decoding = 'async';
            img.alt = 'Infographic Poster';
            img.src = frame.dataset.src;
            img.onload = () => img.classList.add('is-loaded');
            frame.appendChild(img);
        }

        function preloadRunway(currentIdx) {
            const start = Math.max(0, currentIdx - 2);
            const end = Math.min(currentFeedImages.length - 1, currentIdx + 6);
            for (let i = start; i <= end; i++) {
                const f = document.getElementById(`art-frame-${i}`);
                if (f && f.dataset.loaded !== 'true') {
                    loadFrameImage(f);
                }
            }
        }

        function buildPickerDropdown() {
            pickerTotalBadge.textContent = `${currentFeedImages.length} Visual`;
            let html = '';
            currentFeedImages.forEach((img, idx) => {
                html += `
                    <div class="picker-item" onclick="scrollToArticle(${idx});">
                        <img src="${img.url}" class="picker-item-thumb" alt="Thumb" loading="lazy">
                        <span class="picker-item-title">${idx + 1}. ${escapeHtml(img.cleanTitle || img.name)}</span>
                    </div>
                `;
            });
            navPickerList.innerHTML = html;
        }

        function togglePickerDropdown(e) {
            e.stopPropagation();
            navPickerDropdown.classList.toggle('is-open');
        }

        document.addEventListener('click', (e) => {
            if (navPickerDropdown && !navPickerDropdown.contains(e.target) && e.target !== navPickerBtn) {
                navPickerDropdown.classList.remove('is-open');
            }
        });

        function updatePickerActiveIndex(idx) {
            if (navPickerLabel) {
                navPickerLabel.textContent = `Visual ${idx + 1} / ${currentFeedImages.length}`;
            }
            const items = navPickerList.querySelectorAll('.picker-item');
            items.forEach((it, i) => {
                if (i === idx) it.classList.add('active');
                else it.classList.remove('active');
            });
        }

        function scrollToArticle(idx) {
            const frame = document.getElementById(`art-frame-${idx}`);
            if (frame) {
                navPickerDropdown.classList.remove('is-open');
                loadFrameImage(frame);
                preloadRunway(idx);
                frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function setupReaderInteraction() {
            window.addEventListener('scroll', () => {
                if (readerView.style.display !== 'block' || isRestoring) return;

                const currentY = window.scrollY;
                if (currentY > lastScrollY && currentY > 120 && !isNavHidden) {
                    nav.classList.add('nav-hidden');
                    isNavHidden = true;
                } else if (currentY < lastScrollY && isNavHidden) {
                    nav.classList.remove('nav-hidden');
                    isNavHidden = false;
                }
                lastScrollY = currentY;
                saveCurrentPositionDebounced();
            }, { passive: true });

            document.addEventListener('click', (e) => {
                if (readerView.style.display === 'block' && isNavHidden && e.clientY <= 90) {
                    nav.classList.remove('nav-hidden');
                    isNavHidden = false;
                }
            });
        }

        let saveTimeout = null;
        function saveCurrentPositionDebounced() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveCurrentPosition, 250);
        }

        function saveCurrentPosition() {
            if (!currentFolderRaw || readerView.style.display !== 'block') return;
            try {
                let positions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                positions[currentFolderRaw] = {
                    scrollY: window.scrollY,
                    total: currentFeedImages.length,
                    ts: Date.now()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
            } catch(e) {}
        }

        function getSavedPosition(folderRaw) {
            try {
                const positions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                return positions[folderRaw];
            } catch(e) {
                return null;
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('restoreToast');
            const text = document.getElementById('restoreToastText');
            if (!toast || !text) return;
            text.textContent = msg;
            toast.classList.add('is-visible');
            setTimeout(() => toast.classList.remove('is-visible'), 3200);
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function checkUrlHash() {
            const hash = window.location.hash.replace('#', '');
            if (hash && folderMap[hash]) {
                openReader(hash);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.addEventListener('popstate', () => {
            const hash = window.location.hash.replace('#', '');
            if (!hash && readerView.style.display === 'block') {
                closeReader();
            } else if (hash && folderMap[hash] && readerView.style.display !== 'block') {
                openReader(hash);
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
